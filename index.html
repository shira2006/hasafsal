<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>הספסל</title>
    <meta name="theme-color" content="#ffefd6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="הספסל" />
    <!-- מסך הטעינה: מוצג מיד, לפני שהקוד נטען, ומוחלף כשהאפליקציה עולה. (סגנון מוטמע, כי קובץ ה-CSS עוד לא נטען) -->
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { background: #ffefd6; color: #3b4a52; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
      .boot { height: 100%; display: flex; align-items: center; justify-content: center; }
      .boot svg { overflow: visible; }
      .boot path { fill: none; stroke: #3b4a52; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 2.6s ease-in-out infinite both; animation-delay: calc(var(--i, 0) * .2s); }
      .boot path.heart { fill: #ee7d9c; stroke: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0;
        transform-box: fill-box; transform-origin: 50% 100%; animation: boot-heart 2.6s ease-in-out infinite both; animation-delay: 1.7s; }
      @keyframes boot-draw { 0% { stroke-dashoffset: 1; opacity: 1; } 42%, 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes boot-heart { 0%, 5% { opacity: 0; transform: scale(.3); } 20% { opacity: 1; transform: scale(1.15); } 30%, 55% { opacity: 1; transform: scale(1); } 75%, 100% { opacity: 0; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot path { animation: none; stroke-dashoffset: 0; } .boot path.heart { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="טוענים">
        <svg viewBox="0 20 324 168" width="150" height="78" aria-hidden="true">
          <path style="--i:0" pathLength="1" d="M34 34 L286 30 L288 92 L36 96 Z" />
          <path style="--i:1" pathLength="1" d="M37 38 L283 34" />
          <path style="--i:2" pathLength="1" d="M38 92 L285 88" />
          <path style="--i:3" pathLength="1" d="M22 112 L298 108 L304 132 L20 138 Z" />
          <path style="--i:4" pathLength="1" d="M26 116 L296 112" />
          <path style="--i:5" pathLength="1" d="M52 138 L46 178" />
          <path style="--i:6" pathLength="1" d="M268 136 L274 178" />
          <path style="--i:7" pathLength="1" d="M50 96 L52 112" />
          <path style="--i:8" pathLength="1" d="M270 92 L268 110" />
          <path class="heart" d="M286 62 C274 53 266 46 266 37 C266 31 271 27 276 27 C280 27 284 29 286 33 C288 29 292 27 296 27 C301 27 306 31 306 37 C306 46 298 53 286 62 Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
